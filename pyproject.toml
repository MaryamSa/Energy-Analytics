[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmwf-energy-weather-risk"
version = "0.1.0"
description = "A reproducible ECMWF ensemble workflow for European energy-weather signals"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Maryam Saberi"}]
dependencies = [
  "cartopy>=0.24,<0.26",
  "cfgrib>=0.9.14,<0.10",
  "eccodes>=2.40,<3",
  "ecmwf-opendata>=0.3.20,<0.4",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "PyYAML>=6,<7",
  "scikit-learn>=1.5,<2",
  "xarray>=2024.10",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
energy-weather-risk = "energy_weather_risk.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

